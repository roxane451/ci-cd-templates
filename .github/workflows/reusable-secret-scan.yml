name: Reusable — Secret scan

# Scan de secrets sur tout l'historique Git avec Gitleaks (CLI).
# Utilise le binaire officiel plutôt que gitleaks-action, qui exige une
# licence pour les dépôts appartenant à une organisation.

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: "Version de Gitleaks"
        required: false
        type: string
        default: "8.24.0"
      config-path:
        description: "Fichier de configuration Gitleaks (utilisé s'il existe)"
        required: false
        type: string
        default: ".gitleaks.toml"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scanner l'historique
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          set -euo pipefail
          ARGS=(git --redact --verbose)
          if [ -f "${CONFIG_PATH}" ]; then
            echo "Configuration : ${CONFIG_PATH}"
            ARGS+=(--config "${CONFIG_PATH}")
          fi
          gitleaks "${ARGS[@]}" .
